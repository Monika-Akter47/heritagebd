# Render Blueprint for the HeritageBD PHP API (Render → New → Blueprint → this repo).
# Database: Supabase (PostgreSQL). Frontend: Vercel. See docs/deploy-vercel.md.
services:
  - type: web
    name: heritagebd-api          # live at https://heritagebd-api.onrender.com (vercel.json points here)
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .              # repo root, so the committed images are copied into the image
    region: singapore             # same region as the Supabase project (ap-southeast-1)
    plan: free
    healthCheckPath: /api/health  # answers without the database, so a DB problem can't keep the service offline
    envVars:
      - key: DATABASE_URL         # Supabase → Connect → "Session pooler" URI, WITHOUT the password
        sync: false
      - key: DB_PASS              # the Supabase database password, as-is (no URL-encoding needed)
        sync: false
      - key: CORS_ORIGIN          # your Vercel URL, e.g. https://heritagebd.vercel.app (only needed without the /api rewrite)
        sync: false
      - key: APP_TIMEZONE
        value: Asia/Dhaka
